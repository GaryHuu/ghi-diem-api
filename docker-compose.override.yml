# Dev overlay — Docker Compose auto-loads this file with plain `docker compose up`.
# Production skips it: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  api:
    command: sh -c "python manage.py migrate && uvicorn config.asgi:application --reload --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: "no"
