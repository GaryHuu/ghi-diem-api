name: Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Tests need no services: sqlite is used when POSTGRES_HOST is unset and
      # conftest.py swaps the channel layer to in-memory.
      - run: uv sync
      - run: uv run pytest
