name: Health

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Cross-run up/down state lives in the Actions cache: every run saves a
      # fresh entry keyed by run id and the next run restores the most recent
      # one via the restore-keys prefix. GITHUB_TOKEN cannot write repository
      # variables (no "variables" permission scope exists), so the variables
      # API is not an option without a PAT.
      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: state.txt
          key: health-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            health-state-

      - name: Probe /api/health (up to 3 attempts)
        id: probe
        env:
          HEALTH_URL: https://api.ghidiem.online/api/health
          # Probed only when the health check failed, to tell "the API is down"
          # apart from "this runner has no working network".
          CONTROL_URL: https://www.cloudflare.com/cdn-cgi/trace
        run: |
          code=000
          curl_exit=0
          for attempt in 1 2 3; do
            rm -f body.json
            # No -f: a 5xx must still yield its status code, which is the whole
            # point of the report. curl's own exit code separates "no response
            # at all" (code 000) into DNS, connect, timeout and TLS failures.
            if code=$(curl -s -o body.json -w "%{http_code}" --max-time 10 "$HEALTH_URL"); then
              curl_exit=0
            else
              curl_exit=$?
              code=${code:-000}
            fi
            if [ "$code" = "200" ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          if [ "$code" = "200" ]; then
            status=up
          elif curl -fs --max-time 10 -o /dev/null "$CONTROL_URL"; then
            status=down
          else
            # Neither the API nor a known-good URL answered, so the runner's own
            # network is the suspect. Stay quiet rather than cry wolf.
            status=unknown
          fi
          detail=$(head -c 300 body.json 2>/dev/null | tr -d '\n' || true)
          echo "status=$status code=$code curl_exit=$curl_exit"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "curl_exit=$curl_exit" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"

      # On any failure here the step goes red and the "Save state" step is
      # skipped, so the previous state is kept and the next run retries the
      # alert instead of silently swallowing the transition.
      - name: Alert on state transition
        env:
          STATUS: ${{ steps.probe.outputs.status }}
          CODE: ${{ steps.probe.outputs.code }}
          CURL_EXIT: ${{ steps.probe.outputs.curl_exit }}
          DETAIL: ${{ steps.probe.outputs.detail }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          prev=$(cat state.txt 2>/dev/null || echo up)
          echo "previous=$prev current=$STATUS (HTTP $CODE)"
          if [ "$STATUS" = "unknown" ]; then
            echo "Inconclusive run: the control URL failed too. Keeping the previous state."
            echo "$prev" > state.txt
            exit 0
          fi
          if [ "$STATUS" = "$prev" ]; then
            echo "No transition; nothing to do."
            echo "$prev" > state.txt
            exit 0
          fi
          if [ "$STATUS" = "down" ]; then
            # HTTP 000 means no response arrived, so there is no body to quote.
            # Name the transport failure instead, it points at the right layer.
            if [ "$CODE" = "000" ]; then
              case "$CURL_EXIT" in
                6) reason="DNS lookup failed" ;;
                7) reason="connection refused" ;;
                28) reason="timed out" ;;
                35) reason="TLS handshake failed" ;;
                *) reason="curl exit $CURL_EXIT" ;;
              esac
              text="🔴 api.ghidiem.online DOWN (no HTTP response, $reason)"
            else
              text="🔴 api.ghidiem.online DOWN (HTTP $CODE) $DETAIL"
            fi
          else
            text="🟢 api.ghidiem.online recovered (HTTP $CODE)"
          fi
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are not set"
            exit 1
          fi
          curl -fsS --max-time 10 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="$CHAT_ID" --data-urlencode text="$text" > /dev/null
          echo "$STATUS" > state.txt

      - name: Save state
        uses: actions/cache/save@v4
        with:
          path: state.txt
          key: health-state-${{ github.run_id }}-${{ github.run_attempt }}
